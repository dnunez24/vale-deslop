name: evals

on:
  pull_request:
    paths:
      - "Deslop/**"
      - "evals/**"
      - "scripts/eval-*.ts"
      - "tests/evals.test.ts"
  push:
    branches: [main]
    paths:
      - "Deslop/**"
      - "evals/**"
      - "scripts/eval-*.ts"
      - "tests/evals.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run deps:ci
      - run: mise run eval:verify
