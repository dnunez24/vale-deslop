extends: existence
message: |
  Emoji are not appropriate for professional and formal writing. AI-generated
  writing tends to include them regardless of context.
  Fix: Remove the emoji or replace with an actual word.
link: https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing#Emoji_as_formatting
level: warning
scope: text
# Pattern derived directly from Unicode's official emoji properties (UTS #51:
# https://unicode.org/reports/tr51/proposed.html)
# Two classes, split by Emoji_Presentation from emoji-data.txt:
#   - "emoji-default" chars (render as emoji by itself, e.g. 😀🎉🚀) match on
#     their own, with or without the VS16 emoji-styling selector (\x{FE0F}).
#   - "text-default" chars that are ALSO Extended_Pictographic (e.g. ©️ ➡️ ✔️
#     ❤️ ☺️) only count when explicitly styled with VS16, so a bare copyright
#     symbol, arrow, or checkmark used as ordinary prose/technical punctuation
#     is never flagged.
# Also covers keycap sequences (1️⃣ #️⃣ *️⃣), flags (regional-indicator pairs),
# skin-tone modifiers, and ZWJ-joined compound emoji (👨‍👩‍👧‍👦, ❤️‍🔥, 🏳️‍🌈).
#
# Validated with Go's regexp package (the same engine Vale uses) against
# every one of the 5,042 sequences in Unicode 16.0's emoji-test.txt
# (https://unicode.org/Public/emoji/16.0/emoji-test.txt), cross-checked
# against the emoji and modifier charts:
#   https://unicode.org/emoji/charts/full-emoji-list.html
#   https://unicode.org/emoji/charts/full-emoji-modifiers.html
# Result: 100% of "fully-qualified" (3,781/3,781), "minimally-qualified"
# (1,009/1,009), and "component" (9/9) sequences detected -- these are the
# forms any keyboard, emoji picker, or AI tool actually produces. Only bare
# "unqualified" text-default symbols without VS16 (231/243, e.g. ☺ ❤ ✌ 🖐 typed
# as plain text) are intentionally excluded, since flagging those would
# misfire on ordinary prose/technical symbol usage (©, ®, ✓, →, etc.).
# No false positives against realistic prose controls: "(c)"/"(R)"/"(tm)",
# arrows ("->"), percentages, "C++"/"C#", checklist "[x]", digits, "#"
# headings, "*" bullets.
#
# Interactive proof (Golang flavor, matching Vale's regex engine exactly),
# with the full validation test string loaded: https://regex101.com/r/nIpn0l/1
