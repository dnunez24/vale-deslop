StylesPath = .vale/styles
MinAlertLevel = suggestion

# `./Deslop` is this repo's own package directory: `vale sync` copies it into
# StylesPath exactly as a consumer would, so the docs are linted by the artifact
# we ship rather than by loose source files. `./repo-vocab` is not a
# distributable package -- it's a local-only shell that lets `vale sync`
# install this repo's own prose vocabulary (product/tool names that aren't in
# Vale's dictionary) the same way it installs the other two.
Packages = Microsoft, ./Deslop, ./repo-vocab
Vocab = Repo

[*.md]
BasedOnStyles = Vale, Microsoft, Deslop
# Informal technical writing assumes the reader knows common computing
# acronyms (ASCII, MIT, URL, UTM); spelling each one out on first use reads
# as padding, not clarity.
Microsoft.Acronyms = NO
# These nine rules run with `scope: raw` (see Deslop/styles/Deslop/*.yml):
# they measure rhythm/density across a whole document and are immune to
# `<!-- vale off -->` markup, so they can't be scoped around just the
# non-prose parts of a page. This repo's own README documents the same
# finding for consumers linting source-code comments -- badges, tables, and
# headings aren't a continuous document either, so the family misfires here
# too (repeated repo-name tokens in badge URLs, table rows read as
# same-length "sentences", heading text read as staccato fragments).
Deslop.AnaphoraRun = NO
Deslop.BoldFirstBullet = NO
Deslop.ExclamationDensity = NO
Deslop.HedgingDensity = NO
Deslop.ListicleInProse = NO
Deslop.SentenceRhythm = NO
Deslop.StaccatoFragments = NO
Deslop.WhOpener = NO
Deslop.WordEcho = NO

# Generated by release-please, not hand-authored prose.
[CHANGELOG.md]
BasedOnStyles =

# Verbatim community-standard text (Contributor Covenant 2.1). Editing it to
# satisfy a house style guide would defeat the point of adopting a standard,
# widely recognized Code of Conduct verbatim.
[CODE_OF_CONDUCT.md]
BasedOnStyles =

# The working plan this repo was built from, not a shipped doc. Kept for
# history; never edited for style.
[DESLOP_VALE_PACKAGE_PLAN.md]
BasedOnStyles =

# Deliberately slop-filled rule fixtures plus a clean multi-genre corpus, both
# inputs to tests/. The `**` is required: fixtures live in rules/ and clean/.
[tests/fixtures/**]
BasedOnStyles =

# Eval material, not house-authored prose: a deliberately slop-filled corpus, machine-written
# agent output, vendored third-party skills, and a generated report. Linting any of it would
# rewrite the measurement input.
[evals/**]
BasedOnStyles =
