[tools]
bun = "1.4.0"
lefthook = "2.1.11"
rumdl = "0.2.62"
vale = "3.19.0"

[tasks.deps]
description = "Install JavaScript dependencies with Bun"
run = "bun install"
sources = ["package.json", "bun.lock"]
# The trailing `*` matters: mise treats a bare path as a directory and globs
# its contents (`path/**/*`), which never matches a single file -- without
# the `*`, mise never even sees `commitlint` as an existing output. `bun
# install` is idempotent and fast when nothing changed, so this task is
# correct either way; `outputs` mainly documents intent and guarantees a
# rerun when `node_modules` is deleted (verified this session).
outputs = ["node_modules/.bin/commitlint*"]

[tasks."deps:ci"]
description = "Install JavaScript dependencies from the committed lockfile"
run = "bun install --frozen-lockfile"

[tasks.hooks]
description = "Install the Lefthook git hooks"
run = "lefthook install"

[tasks.sync]
description = "Download the Vale styles this repo lints itself with"
run = "vale sync"

[tasks.setup]
description = "Install dependencies, git hooks, and Vale styles"
depends = ["deps", "hooks", "sync"]

[tasks.test]
description = "Run the test suite"
run = "bun test"

[tasks."lint:prose"]
description = "Lint Markdown prose with the Vale, Microsoft, and Deslop styles"
run = "./scripts/lint-prose.sh"

[tasks."lint:md"]
description = "Lint Markdown structure with rumdl"
run = "rumdl check ."

[tasks.build]
description = "Build dist/Deslop.zip"
run = "./scripts/build-package.sh"

[tasks."expected:update"]
description = "Regenerate tests/expected-alerts.json from real Vale output"
run = "bun run scripts/regen-expected.ts"

[tasks."readme:update"]
description = "Regenerate the rule table in README.md"
run = "bun run scripts/regen-rule-table.ts"

[tasks.eval]
description = "Run the Vale Deslop vs. agent-skill eval (spends API credit)"
run = "bun run scripts/eval-run.ts"

[tasks."eval:vendor"]
description = "Vendor the pinned competitor deslop skills into evals/skills"
run = "bun run scripts/eval-vendor-skills.ts"

[tasks."eval:measure"]
description = "Recompute eval metrics from committed run artifacts"
run = "bun run scripts/eval-measure.ts"

[tasks."eval:report"]
description = "Regenerate evals/REPORT.md from the committed results"
run = "bun run scripts/eval-report.ts"

[tasks."eval:verify"]
description = "Fail if committed eval metrics or report drift from the artifacts"
run = "bun run scripts/eval-measure.ts --check && bun run scripts/eval-report.ts --check"

[tasks.ci]
description = "Everything the pull-request workflow runs"
depends = ["test", "lint:prose", "lint:md", "build"]
